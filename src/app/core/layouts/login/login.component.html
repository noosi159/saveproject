  <!-- AI+แก้เอง -->
<div class="bg-login-regis-forgot-otp">
  <!-- Wave Background SVG -->
  <svg
    class="wave-bg-svg"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1440 320"
  >
    <defs>
      <linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FEE0DA" />
        <stop offset="100%" stop-color="#FFFFFF" />
      </linearGradient>
    </defs>
    <path
      fill="url(#gradient)"
      fill-opacity="1"
      d="M0,0L40,42.7C80,85,160,171,240,197.3C320,224,400,192,480,154.7C560,117,640,75,720,74.7C800,75,880,117,960,154.7C1040,192,1120,224,1200,213.3C1280,203,1360,149,1400,122.7L1440,96L1440,320L1400,320C1360,320,1280,320,1200,320C1120,320,1040,320,960,320C880,320,800,320,720,320C640,320,560,320,480,320C400,320,320,320,240,320C160,320,80,320,40,320L0,320Z"
    ></path>
  </svg>

  <!-- Logo -->
  <div class="logo-bottom-left">
    <img
      src="https://minioapi.iotechsoft.com/api/v1/uploads/jele/logo-text-black.png?path=assest"
      alt="aji"
    />
  </div>

  <!-- Flex Layout Content -->
  <div
    class="flex flex-col md:flex-row items-center justify-center min-h-screen px-6 md:px-40 py-10 gap-8 z-10 relative"
  >
    <!-- ข้อความ (ขวาใน desktop, บนใน mobile) -->
    <div class="md:w-1/2 text-center md:text-center space-y-4">
      <h1 class="font-semibold text-3xl md:text-5xl text-gray-800">
        Welcome back
      </h1>
      <p class="font-semibold text-gray-600 text-lg">
        Lorem ipsum is placeholder text commonly used in the graphic, print
      </p>
    </div>

    <!-- การ์ด (ซ้ายใน desktop, ล่างใน mobile) -->
    <div class="md:w-1/2 flex justify-center">
      <div class="bg-white rounded-2xl shadow-lg p-12 w-full max-w-sm">
        <div class="mb-7">
          <h3 class="font-semibold text-2xl text-gray-800">Sign In</h3>
          <p class="text-gray-400">
            Don't have an account?
            <a
              routerLink="/sign-up"
              class="text-sm text-purple-700 hover:text-purple-700"
              >Sign Up</a
            >
          </p>
        </div>

        <form>
          <div class="space-y-6">
            <!-- Email -->

            <p-floatlabel class="w-full">
              <input
                id="email"
                pInputText
                [(ngModel)]="email"
                name="email"
                class="w-full text-sm px-4 py-3 bg-gray-200 focus:bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-400"
              />
              <label for="email">Email</label>
            </p-floatlabel>

            <!-- Password -->
            <div class="relative w-full">
              <p-floatlabel class="w-full">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  pInputText
                  id="password"
                  [(ngModel)]="password"
                  name="password"
                  class="w-full text-sm px-4 py-3 pr-10 bg-gray-200 focus:bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-400"
                />
                <label for="password">Password</label>
              </p-floatlabel>

              <!-- Toggle Button -->
              <button
                type="button"
                class="absolute inset-y-0 right-0 mr-3 flex items-center text-purple-700"
                (click)="showPassword = !showPassword"
                tabindex="-1"
              >
                <i *ngIf="!showPassword" class="pi pi-eye"></i>
                <i *ngIf="showPassword" class="pi pi-eye-slash"></i>
              </button>
            </div>

            <!-- Forgot Password -->
            <div class="flex items-center justify-between md:text-right">
              <div class="text-sm ml-auto">
                <a
                  routerLink="/forgot-pass"
                  class="text-purple-700 hover:text-purple-600"
                >
                  Forgot your password?
                </a>
              </div>
            </div>

            <!-- Sign In Button -->
            <button
              type="submit"
              pButton
              label="Sign in"
              [routerLink]="['/Login-Otp']"
              class="w-full bg-purple-800 hover:bg-purple-700 text-gray-100 p-3 rounded-lg tracking-wide font-semibold cursor-pointer transition ease-in duration-500"
            ></button>
          </div>
          <div class="mt-7 text-center text-gray-400 text-xs">
            <span> Copyright © 2025 UPORT. Empowering Future Developers. </span>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
