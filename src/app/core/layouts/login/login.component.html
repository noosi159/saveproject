<!-- เปลี่ยนพื้นหลังเป็นสีขาว -->
<div class="absolute top-0 left-0 bottom-0 right-0 h-full w-full overflow-hidden -z-10"
  style="background: linear-gradient(to bottom, #FECDDF 0%,#FFFFFF 50%,#FFFFFF 70%,#FFFFFF 100%)"
></div>

<div class="relative min-h-screen sm:flex sm:flex-row justify-center bg-transparent rounded-3xl shadow-xl gap-x-20">
  <!-- Welcome Text -->
  <div class="flex-col flex self-center lg:px-14 sm:max-w-4xl xl:max-w-md z-10">
    <div class="self-start hidden lg:flex flex-col text-gray-800">
      <h1 class="my-3 font-semibold text-4xl">Welcome</h1>
      <p class="pr-3 text-sm opacity-75">
        Start your Portfolio Now
      </p>
    </div>
  </div>

  <!-- Login Card -->
  <div class="flex justify-center self-center z-10">
    <div class="p-12 bg-white mx-auto rounded-3xl w-110 h-100">
      <div class="mb-7">
        <h3 class="font-semibold text-2xl text-gray-800">Sign In</h3>
        <p class="text-gray-400">
          Don't have an account?
          <a routerLink="/signup" class="text-sm text-purple-700 hover:text-purple-700">Sign Up</a>

        </p>
      </div>

      <form>
        <div class="space-y-6">
          <!-- Email -->
          <div>
       <p-floatlabel class="w-full">
  <input
    id="email"
    pInputText
    [(ngModel)]="email"
    name="email"
    class="w-full text-sm px-4 py-3 bg-gray-200 focus:bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-400"
  />
  <label for="email">Email</label>
</p-floatlabel>
          </div>

          <!-- Password -->
          <div class="relative w-full">
  <p-floatlabel class="w-full">
    <input
      [type]="showPassword ? 'text' : 'password'"
      pInputText
      id="password"
      [(ngModel)]="password"
      name="password"
      class="w-full text-sm px-4 py-3 pr-10 bg-gray-200 focus:bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-400"
    />
    <label for="password">Password</label>
  </p-floatlabel>

  <!-- Toggle Button -->
  <button
    type="button"
    class="absolute inset-y-0 right-0 mr-3 flex items-center text-purple-700"
    (click)="showPassword = !showPassword"
    tabindex="-1"
  >
    <i *ngIf="!showPassword" class="pi pi-eye"></i>
    <i *ngIf="showPassword" class="pi pi-eye-slash"></i>
  </button>
</div>

          <!-- Forgot Password -->
          <div class="flex items-center justify-between">
            <div class="text-sm ml-auto">
              <a routerLink="/forgot-password" class="text-purple-700 hover:text-purple-600">
                Forgot your password?
              </a>
            </div>
          </div>

          <!-- Sign In Button -->
          <div>
            <button
              type="submit"
              pButton
              label="Sign in"
              class="w-full bg-purple-800 hover:bg-purple-700 text-gray-100 p-3 rounded-lg tracking-wide font-semibold cursor-pointer transition ease-in duration-500"
            ></button>
          </div>

          <!-- Separator -->
         
        </div>
      </form>
    </div>
  </div>
  <!-- Image -->
<!-- Wave SVG (คงเดิม) -->
<svg class="absolute bottom-0 left-0 w-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEE0DA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <path
    fill="url(#gradient)"
    fill-opacity="1"
    d="M0,0L40,42.7C80,85,160,171,240,197.3C320,224,400,192,480,154.7C560,117,640,75,720,74.7C800,75,880,117,960,154.7C1040,192,1120,224,1200,213.3C1280,203,1360,149,1400,122.7L1440,96L1440,320L1400,320C1360,320,1280,320,1200,320C1120,320,1040,320,960,320C880,320,800,320,720,320C640,320,560,320,480,320C400,320,320,320,240,320C160,320,80,320,40,320L0,320Z"
  ></path>
</svg>
<div class="absolute bottom-4 left-6 flex items-center space-x-2 z-10">
  <img src="/logo.png" alt="aji" class="w-30 h-30" />
</div>
