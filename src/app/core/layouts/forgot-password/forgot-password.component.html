<div class="bg-login-regis-forgot-otp">
  <!-- Wave Background SVG -->
  <svg
    class="wave-bg-svg"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1440 320"
  >
    <defs>
      <linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FEE0DA" />
        <stop offset="100%" stop-color="#FFFFFF" />
      </linearGradient>
    </defs>
    <path
      fill="url(#gradient)"
      fill-opacity="1"
      d="M0,0L40,42.7C80,85,160,171,240,197.3C320,224,400,192,480,154.7C560,117,640,75,720,74.7C800,75,880,117,960,154.7C1040,192,1120,224,1200,213.3C1280,203,1360,149,1400,122.7L1440,96L1440,320L1400,320C1360,320,1280,320,1200,320C1120,320,1040,320,960,320C880,320,800,320,720,320C640,320,560,320,480,320C400,320,320,320,240,320C160,320,80,320,40,320L0,320Z"
    ></path>
  </svg>

  <!-- Logo -->
  <div class="logo-bottom-left">
    <img
      src="https://minioapi.iotechsoft.com/api/v1/uploads/jele/logo-text-black.png?path=assest"
      alt="aji"
    />
  </div>
  <!-- Form Container (Card) -->
  <div
    class="flex flex-col items-center justify-center min-h-screen px-6 py-10 z-10 relative"
  >
    <div class="p-12 bg-white rounded-3xl w-full max-w-2xl shadow-xl">
      <div class="mb-7">
        <h2
          class="mb-4 text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white"
        >
          Change Password
        </h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
          <div>
            <label
              for="email"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >Your email</label
            >
            <input
              pInputText
              formControlName="email"
              type="email"
              id="email"
              placeholder="name@live.rmutl.ac.th"
              class="w-full px-4 py-2 border border-gray-300 rounded-md"
            />
            <p-message
              *ngIf="
                form.controls['email'].invalid && form.controls['email'].touched
              "
              severity="error"
              text="Valid email is required."
            >
            </p-message>
          </div>

          <div>
            <label
              for="password"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >New Password</label
            >
            <input
              pInputText
              formControlName="password"
              type="password"
              id="password"
              placeholder="••••••••"
              class="w-full px-4 py-2 border border-gray-300 rounded-md"
            />
            <p-message
              *ngIf="
                form.controls['password'].invalid &&
                form.controls['password'].touched
              "
              severity="error"
              text="Password is required."
            >
            </p-message>
          </div>

          <div>
            <label
              for="confirmPassword"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >Confirm Password</label
            >
            <input
              pInputText
              formControlName="confirmPassword"
              type="password"
              id="confirmPassword"
              placeholder="••••••••"
              class="w-full px-4 py-2 border border-gray-300 rounded-md"
            />
            <p-message
              *ngIf="form.errors?.['passwordMismatch'] && form.controls['confirmPassword'].touched"
              severity="error"
              text="Passwords do not match."
            >
            </p-message>
          </div>
          <button
            pButton
            type="submit"
            label="Reset Password"
            class="w-full"
            [disabled]="form.invalid"
          ></button>
          <div class="mt-5 text-center text-gray-400 text-xs">
            <span> Copyright © 2025 UPORT. Empowering Future Developers. </span>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
