<!-- Header -->
<div class="relative w-full h-[278px]">
  <img
    src="/images/bg1.png"
    alt="header background"
    class="absolute inset-0 w-full h-full object-cover object-center"
  />
  <div class="relative z-10 flex items-center justify-center h-full">
    <p class="text-white text-4xl md:text-[69px] font-bold text-center">
      Import Portfolio
    </p>
  </div>
</div>

<!-- Form -->
<div class="max-w-3xl mx-auto px-4 py-12">
  <form class="space-y-6">
 <!-- Upload file -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">
    Choose File
  </label>

  <div class="relative mt-2">
    <!-- ไอคอน Upload -->
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 12V4m0 0L8 8m4-4l4 4" />
      </svg>
    </div>

    <!-- input file -->
    <input
      type="file"
      class="block w-full pl-10 pr-4 py-2 text-sm border border-gray-300 rounded-lg file:border-0 file:bg-white file:text-gray-700 file:font-medium
        cursor-pointer file:mr-4 file:px-4 hover:file:bg-gray-100"
    />
  </div>

  <p class="mt-1 text-xs text-gray-500">
    Supported file formats: PDF, Word, JPEG, PNG, Video (MP4, YouTube) not more than 100MB
  </p>
</div>

     

    <!-- Category -->
    <div>
      <label class="block text-sm font-medium text-gray-700">
        Choose your categorize
      </label>
      <select
        class="mt-2 w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-indigo-500"
      >
        <option selected disabled>Select your categorize</option>
        <option value="fontend">Frontend developer</option>
        <option value="backend">Backend developer</option>
        <option value="ux-ui">UX/UI</option>
        <option value="devops">DevOps</option>
        <option value="tester">Tester/QA</option>
        <option value="ai">AI/ML</option>
        <option value="full-dev">Full-stack developer</option>
        <option value="mobile-dev">Mobile developer</option>
      </select>
    </div>

    <!-- Repository URL -->
    <div>
      <label class="block text-sm font-medium text-gray-700">
        Repository URL
      </label>
      <input
        type="url"
        placeholder="https://github.com/username/repository"
        class="mt-2 block w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-indigo-500"
      />
      <p class="mt-1 text-xs text-gray-500">
        Supported Repository Formats:<br />
        • GitHub: https://github.com/username/repository<br />
        • GitLab: https://gitlab.com/username/repository
      </p>
    </div>

    <label class="text-sm font-medium text-gray-700">Details</label>
          <textarea name="message" ngModel required placeholder="Details about yourself that you would like to include"
                    class="text-sm border  border-gray-300 rounded px-4 py-2 w-full h-32 resize-none focus:ring-blue-500 focus:outline-none"></textarea>

    <!-- Import Button -->
    <div class="text-right">
      <button
        type="submit"
        class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 text-sm"
      >
        Import
      </button>
    </div>
  </form>
</div>
